name: Golden Set

# T4.1(E4.1) — docs/14-backlog.md DoD: "프롬프트 변경 PR에서 골든셋이 자동으로 돌고
# 결과가 코멘트된다". 기본 CI 잡(ci.yml)은 실 DB에 연결하지 않도록 의도적으로 분리돼
# 있어서(ci.yml 주석 참고) 골든셋은 postgres 서비스 컨테이너를 쓰는 별도 워크플로로 둔다.
# ANTHROPIC_API_KEY 시크릿이 없으면 scripts/run-golden.ts가 결정론적 참조 판정기로 자동
# 전환한다(§주석) — 이 저장소엔 아직 그 시크릿이 없으므로 항상 참조 판정기 모드로 돈다.

on:
  pull_request:

jobs:
  golden:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gukjang
          POSTGRES_PASSWORD: gukjang
          POSTGRES_DB: gukjang_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gukjang:gukjang@localhost:5432/gukjang_radar
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: make db-migrate

      - name: Seed
        run: make db-seed

      - name: Run golden set
        id: golden
        run: |
          set +e
          make golden > golden-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat golden-output.txt

      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('golden-output.txt', 'utf-8');
            const passed = '${{ steps.golden.outputs.exit_code }}' === '0';
            const body = [
              `### 🧪 골든셋 결과 ${passed ? '✅ 통과' : '❌ 미달'}`,
              '<details><summary>전체 출력</summary>',
              '',
              '```',
              output.slice(-6000),
              '```',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('### 🧪 골든셋 결과'));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if golden set below threshold
        if: steps.golden.outputs.exit_code != '0'
        run: exit 1
